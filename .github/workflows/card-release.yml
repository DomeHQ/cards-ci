name: Card Release

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version for the build
        required: false
        type: string
        default: '22.20.0'
    secrets:
      WEBAPP_DEPLOY_TOKEN:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: |
          set -o pipefail
          npm run build | tee build-output-ansi.txt
          sed 's/\x1b\[[0-9;]*m//g' build-output-ansi.txt > build-output.txt
          rm build-output-ansi.txt

      # React: build/ ; Angular: dist/
      - name: Zip build output
        run: |
          BUILD_DIR='build'
          if [ -d 'dist' ]; then
            BUILD_DIR='dist'
          fi
          echo "Using build directory: $BUILD_DIR"
          if [ ! -f build-output.txt ]; then
            echo 'build-output.txt missing; build step should have generated it'
            exit 1
          fi

          zip -r card-build.zip "$BUILD_DIR" build-output.txt

      - name: Request upload URL and upload ZIP
        env:
          WEBAPP_DEPLOY_TOKEN: ${{ secrets.WEBAPP_DEPLOY_TOKEN }}
        run: |
          if [ ! -f manifest-card.json ]; then
            echo 'manifest-card.json not found in repository root'
            exit 1
          fi

          WEBAPP_ID=$(jq -r '.iuid // empty' manifest-card.json)
          if [ -z "$WEBAPP_ID" ]; then
            echo 'iuid missing in manifest-card.json'
            exit 1
          fi

          API_URL="https://api.intouch.so/api/v1/webapps/${WEBAPP_ID}/deploy/request_upload_zip_url/"

          echo "Requesting presigned POST from: ${API_URL}"

          RESPONSE=$(curl -sS -X POST \
            -H "X-Deploy-Token: ${WEBAPP_DEPLOY_TOKEN}" \
            "${API_URL}")

          echo "API response: $RESPONSE"

          UPLOAD_URL=$(echo "$RESPONSE" | jq -r '.zip.upload_url')
          FILENAME=$(echo "$RESPONSE" | jq -r '.zip.filename')

          if [ -z "$UPLOAD_URL" ] || [ "$UPLOAD_URL" = 'null' ]; then
            echo 'upload_url missing in response'
            exit 1
          fi

          if [ -z "$FILENAME" ] || [ "$FILENAME" = 'null' ]; then
            echo 'filename missing in response'
            exit 1
          fi

          if [ ! -f card-build.zip ]; then
            echo 'card-build.zip not found before rename'
            exit 1
          fi

          mv card-build.zip "$FILENAME"
          echo "Renamed ZIP to: $FILENAME"

          echo "Upload URL: $UPLOAD_URL"

          CURL_FIELDS=$(echo "$RESPONSE" | jq -r '.zip.fields | to_entries[] | "-F \"" + .key + "=" + .value + "\""' | xargs)

          echo "Uploading $FILENAME using presigned POST..."

          # shellcheck disable=SC2086
          eval "curl -f -X POST $CURL_FIELDS -F \"file=@$FILENAME\" \"$UPLOAD_URL\""
