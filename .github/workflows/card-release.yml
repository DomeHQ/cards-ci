name: Card Release

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version for the build
        required: false
        type: string
        default: '22.20.0'
    secrets:
      WEBAPP_ID:
        required: true
      WEBAPP_DEPLOY_TOKEN:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      # React: build/ ; Angular: dist/
      - name: Zip build output
        run: |
          BUILD_DIR='build'
          if [ -d 'dist' ]; then
            BUILD_DIR='dist'
          fi
          echo "Using build directory: $BUILD_DIR"
          zip -r card-build.zip "$BUILD_DIR"

      - name: Request upload URL from Dome
        id: upload_url
        env:
          WEBAPP_ID: ${{ secrets.WEBAPP_ID }}
          WEBAPP_DEPLOY_TOKEN: ${{ secrets.WEBAPP_DEPLOY_TOKEN }}
        run: |
          API_URL="https://api.intouch.so/api/v1/webapps/${WEBAPP_ID}/deploy/request_upload_zip_url/"
          echo "Requesting upload URL from: $API_URL with token $WEBAPP_DEPLOY_TOKEN"

          RESPONSE=$(curl -sS -X POST \
            -H "X-Deploy-Token: ${WEBAPP_DEPLOY_TOKEN}" \
            "${API_URL}")

          echo "API response: $RESPONSE"

          UPLOAD_URL=$(echo "$RESPONSE" | jq -r '.zip.upload_url')
          FILENAME=$(echo "$RESPONSE" | jq -r '.zip.filename')

          if [ -z "$UPLOAD_URL" ] || [ "$UPLOAD_URL" = 'null' ]; then
            echo 'upload_url missing in response'
            exit 1
          fi

          if [ -z "$FILENAME" ] || [ "$FILENAME" = 'null' ]; then
            echo 'filename missing in response'
            exit 1
          fi

          echo "Will upload as: $FILENAME"
          echo "upload_url=$UPLOAD_URL" >> "$GITHUB_OUTPUT"
          echo "filename=$FILENAME" >> "$GITHUB_OUTPUT"

      - name: Upload ZIP to S3 via presigned URL
        run: |
          UPLOAD_URL='${{ steps.upload_url.outputs.upload_url }}'
          echo "Uploading card-build.zip to: $UPLOAD_URL"

          curl -X PUT \
            -H 'Content-Type: application/zip' \
            --upload-file card-build.zip \
            "$UPLOAD_URL"
